name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate composer.json
        run: composer validate --strict

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm test

  php:
    needs: js
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*', '13.*']
        livewire: ['^3.6', '^4.0']
        exclude:
          # Laravel 13 requires PHP 8.3+ — 8.2 x 13 is an invalid cell.
          - php: '8.2'
            laravel: '13.*'
        include:
          # composer require "livewire/livewire:^4.0" always resolves to the
          # newest 4.x (4.4.5 as of writing), so no cell generated by the
          # matrix above has ever actually run against the earliest 4.x
          # releases, where Message objects don't expose an isSkipped()
          # method at all — calling it unconditionally throws and kills
          # every Livewire request on the page.
          #
          # Two independent constraints shape this one cell:
          # - livewire/livewire v4.0.0-v4.0.3 require illuminate/support
          #   ^10.0|^11.0|^12.0, not ^13.0, so this cell must pair with
          #   laravel '12.*', never '13.*' (confirmed live: pairing with
          #   13.* fails dependency resolution outright).
          # - Every v4.0.0-v4.3.3 release is additionally rejected by
          #   Composer's advisory-block policy (PKSA-bgw4-5zmg-2njg /
          #   CVE-2026-81887, a DOM XSS in Livewire's client-side state
          #   handling — confirmed via Packagist's security-advisories API
          #   that its affectedVersions is ">=4.0.0-beta.1,<=4.3.3", i.e. it
          #   covers the entire range still missing isSkipped(), which only
          #   appears starting at v4.3.0). No Livewire 4.x release is both
          #   installable under the default policy and still missing
          #   isSkipped(), so this one advisory is ignored for this one
          #   cell only (see the "Require matrix versions" step below) —
          #   never for the package's own composer.json, which real
          #   consumers install from and which the composer-audit job below
          #   keeps auditing normally.
          #
          # php 8.4 x laravel 12.* isn't in the exclude list above, and 8.4
          # doesn't trip the PHP-8.2-only pest-plugin-browser skip below, so
          # the Browser suite (including tests/Contract) actually runs here.
          - php: '8.4'
            laravel: '12.*'
            livewire: '4.0.*'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci && npm run build
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Require matrix versions
        run: |
          if [ "${{ matrix.livewire }}" = "4.0.*" ]; then
            # Composer's advisory-block policy otherwise refuses to resolve
            # ANY v4.0.0-v4.3.3 release (see the matrix comment above for
            # the full investigation) — ignored for this ephemeral CI job
            # only, never written to the package's own composer.json. The
            # advisory (DOM XSS via attacker-controlled morph content in
            # Livewire's client-side state handling) has no bearing here:
            # this job only ever renders tests/Browser's own fixed fixture
            # page, never attacker-controlled input.
            php -r '
              $f = "composer.json";
              $j = json_decode(file_get_contents($f), true);
              $j["config"]["policy"]["advisories"]["ignore-id"] = [
                "PKSA-bgw4-5zmg-2njg" => "CI-only install of an old Livewire 4.x floor release to test this package'"'"'s own JS bridge against isSkipped()'"'"'s absence; this job only ever renders tests/Browser'"'"'s fixed fixture page (no attacker-controlled input reaches Livewire'"'"'s morph), so the advisory'"'"'s client-side-XSS scenario cannot occur here. Never installed for real consumers.",
              ];
              file_put_contents($f, json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
            '
          fi
          composer require "illuminate/support:${{ matrix.laravel }}" "livewire/livewire:${{ matrix.livewire }}" --no-interaction --no-update
          if [ "${{ matrix.php }}" = "8.2" ]; then
            # pestphp/pest-plugin-browser has no PHP-8.2-compatible release
            # (floor raised to ^8.3 as of 4.0.2; confirmed against the full
            # version history, nothing 4.x or 5.x supports 8.2 — issue #11).
            # Drop it for this cell only so composer update can still resolve;
            # the Browser suite is skipped for PHP 8.2 in the test-run step below.
            composer remove pestphp/pest-plugin-browser --dev --no-update
          fi
          composer update --prefer-dist --no-interaction --no-progress
      - name: Install Playwright browser for Pest
        if: matrix.php != '8.2'
        run: npx playwright install --with-deps chromium
      - name: Generate the comma-decimal locale the geometry test needs
        run: |
          sudo locale-gen de_DE.UTF-8
          # A quiet locale-gen failure would turn LearnedTreeTest's
          # locale-independence check into a permanent skip and leave this job
          # green for the wrong reason - exactly the vacuous-green shape M7
          # spent seven task reviews removing. Assert PHP itself sees a comma.
          php -r '
            setlocale(LC_NUMERIC, "de_DE.UTF-8", "de_DE", "de_DE.utf8");
            $d = localeconv()["decimal_point"];
            if ($d !== ",") {
                fwrite(STDERR, "de_DE never took effect; decimal_point is still \"$d\"\n");
                exit(1);
            }
            echo "de_DE active, decimal_point is a comma\n";
          '
      - name: Run tests
        run: |
          if [ "${{ matrix.php }}" = "8.2" ]; then
            # tests/Contract is excluded too, not just tests/Browser: its
            # BridgeSurfaceTest.php calls Pest core's bare visit() helper
            # (vendor/pestphp/pest/src/Functions.php), which — when
            # Pest\Browser\Configuration doesn't exist, exactly the state
            # this cell is in since pest-plugin-browser was removed above —
            # runs the plugin-browser installer prompt and then exit(0)s the
            # whole process with a SUCCESS code before any assertions run,
            # silently short-circuiting the rest of the suite too. Confirmed
            # no other file under tests/Unit or tests/Feature calls visit().
            vendor/bin/pest tests/Unit tests/Feature
          else
            vendor/bin/pest
          fi
