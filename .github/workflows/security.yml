name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies for known vulnerabilities
        run: composer audit

  dist-reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - name: Verify resources/dist matches a fresh build (SPEC-SEC-07)
        run: |
          if ! git diff --quiet -- resources/dist; then
            echo "::error::resources/dist/* is not reproducible from js/src — rebuild and commit before merging."
            git diff -- resources/dist
            exit 1
          fi
