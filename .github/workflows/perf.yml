name: perf

# Issue #18. The old perf.yml was a job named 'placeholder' running 'echo' on
# workflow_dispatch — green while asserting nothing — and was deleted for it.
# This one runs the structural performance suite (SDD §11 / ADR-007): every
# gate is a count of bytes or operations, never a duration, so it cannot go
# red because a shared runner is slow.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SPEC-PERF-08 (bundle budget), SPEC-PERF-01/02 (read-before-write, jsdom)
  # and SPEC-PERF-11 (lifecycle leaks). No browser.
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - name: Report bundle size (SPEC-PERF-08 budget is 10 KB gzip)
        run: |
          for f in resources/dist/ghostwire.js resources/dist/ghostwire.css; do
            printf '%s raw=%s gzip=%s\n' "$f" "$(wc -c < "$f")" "$(gzip -c "$f" | wc -c)"
          done
      - name: Structural invariants (js/tests/perf-*.test.js)
        run: npx vitest run --config js/vitest.config.js perf-

  # SPEC-PERF-01..04 and the render budget against the real built runtime in
  # a real browser, on both Livewire lines (SPEC-INT-23 / SPEC-PERF-09). One
  # PHP/Laravel cell is enough: the runtime under test is JavaScript.
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        livewire: ['^3.6', '^4.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci && npm run build
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Require the matrix Livewire line
        run: |
          composer require "livewire/livewire:${{ matrix.livewire }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress
      - name: Install Playwright browser for Pest
        run: npx playwright install --with-deps chromium
      - name: Performance suite
        run: vendor/bin/pest tests/Browser/Performance
