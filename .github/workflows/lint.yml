name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          # 8.3+ required: see security.yml's composer-audit job for why.
          php-version: '8.3'

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  # This used to be enforced by requiring every PR to touch CHANGELOG.md
  # by hand. Since v1.0.0 that file is generated by release-please from the
  # commit subjects, so a hand-written entry would be duplicated by the
  # generated one. The requirement did not go away — it moved: a commit that is
  # not a Conventional Commit is silently ignored by release-please, which means
  # no changelog entry AND no version bump, with nothing going red anywhere.
  # This job is what makes that failure loud.
  commit-convention:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require Conventional Commits
        # BASE_REF goes through env rather than being interpolated straight into
        # the script: `${{ }}` is substituted textually before bash parses the
        # line, so a ref containing shell metacharacters would break out of the
        # quotes. Same reason applies to every untrusted `github.event.*` field.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          # Merge commits are excluded on purpose: release-please cannot parse
          # "Merge pull request #N from ..." either, and skips them harmlessly.
          git log --no-merges --format=%s "origin/$BASE_REF..HEAD" > subjects.txt
          bad=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            if ! printf '%s\n' "$subject" | grep -qE '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+'; then
              echo "::error::Not a Conventional Commit: ${subject}"
              bad=1
            fi
          done < subjects.txt
          if [ "$bad" -ne 0 ]; then
            echo "::error::release-please builds CHANGELOG.md and the version bump from these subjects. A non-conventional subject is skipped silently: no changelog entry, no release."
            exit 1
          fi
