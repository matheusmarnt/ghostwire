name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          # 8.3+ required: see security.yml's composer-audit job for why.
          php-version: '8.3'

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  changelog:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'changelog-exempt')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require CHANGELOG.md entry (SPEC-PKG-10)
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "::error::CHANGELOG.md was not updated in this PR (SPEC-PKG-10). Add an entry, or apply the 'changelog-exempt' label."
            exit 1
          fi
